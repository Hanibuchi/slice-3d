[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slice3d"
version = "0.1.1"
description = "Library/CLI that slices a 3D model at regular intervals and exports the cross-sections (outlines)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "hanibuchi", email = "hanitech8686@gmail.com" }]
keywords = ["3d", "mesh", "slicing", "cross-section", "trimesh", "cad", "stl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "trimesh>=4.0.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
# gui.py needs matplotlib>=3.8 because it relies on RadioButtons/Slider's
# radio_props, label_props, and handle_style (used to enlarge widget click targets).
# matplotlib>=3.11 has a regression where TextBox's resize_event handler gets
# wrapped by `_call_with_reparented_event`, and ResizeEvent lacks an `inaxes`
# attribute, causing an AttributeError (the thickness field is a TextBox, so this
# always reproduces on window resize). Excluded until a fixed release is out.
gui = ["matplotlib>=3.8,!=3.11.*", "fast-simplification>=0.1.7"]
dev = ["pytest>=7.0", "matplotlib>=3.8,!=3.11.*", "fast-simplification>=0.1.7"]

[project.scripts]
slice3d = "slice3d.cli:main"
slice3d-gui = "slice3d.gui:main"

[project.urls]
Homepage = "https://github.com/Hanibuchi/slice-3d"
Issues = "https://github.com/Hanibuchi/slice-3d/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slice3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
